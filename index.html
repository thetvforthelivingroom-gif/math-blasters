<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Math Blasters MVP</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Math Blasters</h1>
<div id="gameContainer">
  <div id="questionArea"><span id="question">Loading...</span></div>
  <div id="status">
    <span id="score">Score: 0</span> |
    <span id="hp">HP: ♥♥♥</span> |
    <span id="highScore">High Score: 0</span>
  </div>
  <div id="enemyContainer"></div>
</div>
<div id="controls">
  <button id="pauseBtn">Pause</button>
  <button id="restartBtn">Restart</button>
  <button id="muteBtn">Mute</button>
</div>
<script src="game.js"></script>
</body>
</html>
